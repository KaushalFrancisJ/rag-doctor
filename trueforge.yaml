# TrueForge Agent Harness Configuration for RAG Doctor
# ----------------------------------------------------
# This configuration sets up:
# 1. Model Provider: Native Google Gemini
# 2. Sandbox Provider: Daytona (for isolated remediation execution)
# 3. MCP Server: RAG Doctor local MCP server (SSE transport)
# 4. Agent Spec: RAG Doctor orchestrator agent definition

# ----------------------------------------------------
# 1. Model Provider Configuration (Google Gemini Native)
# ----------------------------------------------------
models:
  provider:
    type: google-gemini
    base_url: https://generativelanguage.googleapis.com/v1beta
    auth:
      api_key_env: GEMINI_API_KEY
    models:
      - model_id: gemini-2.5-flash
        name: gemini-2-5-flash
        properties:
          context_length: 1048576
          max_output_tokens: 65536
          reasoning_efforts:
            - minimal
            - low
            - medium
            - high
      - model_id: gemini-2.5-pro
        name: gemini-2-5-pro
        properties:
          context_length: 1048576
          max_output_tokens: 65536
          reasoning_efforts:
            - low
            - medium
            - high
      - model_id: gemini-2.0-flash
        name: gemini-2-0-flash
        properties:
          context_length: 1048576
          max_output_tokens: 65536
          reasoning_efforts:
            - none
            - low
            - medium
            - high

# ----------------------------------------------------
# 2. Sandbox Provider Configuration (Daytona)
# ----------------------------------------------------
sandbox:
  provider:
    type: daytona
    auth:
      api_key_env: DAYTONA_API_KEY
    exec_timeout_ms: 60000
    auto_stop_interval_in_minutes: 5
    auto_archive_interval_in_minutes: 60
    auto_delete_interval_in_minutes: 7200

# ----------------------------------------------------
# 3. Model Context Protocol (MCP) Server Configuration
# ----------------------------------------------------
mcp_servers:
  - name: rag-doctor-mcp
    type: remote
    url: http://127.0.0.1:8000/sse
    description: RAG Doctor MCP server providing health inspection, retrieval diagnostics, and eval reports.

# ----------------------------------------------------
# 4. Agent Spec (RAG Doctor Orchestrator & Subagents)
# ----------------------------------------------------
agent:
  name: rag-doctor
  model:
    provider: google-gemini
    name: google-gemini/gemini-2-5-flash
  instructions: |
    You are RAG Doctor 🩺, an autonomous self-healing RAG pipeline agent.
    Your workflow:
    1. Inspect pipeline health using `inspect_rag_health` from the RAG Doctor MCP server.
    2. If health is DEGRADED, delegate the investigation to the Diagnose subagent using `create_sub_agent`:
       - Subagent name: `diagnose`
       - Task input: "Investigate pipeline degradation for active index. Analyze failing queries, retrieve configurations, and output the root cause diagnosis JSON."
    3. Delegate remediation design to the Fix subagent using `create_sub_agent`:
       - Subagent name: `fix`
       - Task input: "Formulate an isolated candidate experiment specification based on the diagnosis and configurations."
    4. Review the candidate experiment specification (`strategy`, `changes`, `hypothesis`).
    5. Execute the candidate experiment and evaluation inside the TrueForge Sandbox:
       - Run the isolated remediation in the sandbox environment:
         `python sandbox_scripts/remediate.py --strategy <strategy> --chunk-size <chunk_size> --overlap <overlap> --output-version <candidate_version>`
       - Run candidate evaluation in the sandbox against held-out queries:
         `python -m eval.compare --candidate-version <candidate_version>`
       - (Or invoke the candidate experiment runner `create_experiment` with candidate parameters).
       - All experimentation, re-chunking, re-embedding, and evaluation occur strictly inside the isolated sandbox and never touch the active index.
    6. Review the candidate evaluation comparison results (baseline score, degraded score, candidate score, deltas, regressions).
    7. Before requesting approval, present the structured candidate summary to the user:
       - suspected cause
       - evidence
       - experiment
       - current score
       - candidate score
       - score delta
       - regressions
       - candidate version
    8. Pause for explicit human approval using the native TrueForge ask-user-question checkpoint:
       - Prompt: "Promote <candidate_version> to active?"
       - If APPROVED:
         - Call `promote_experiment` with candidate_version to promote candidate, update `indexes/active.json`, preserve previous active version, and record promotion metadata.
       - If REJECTED:
         - Call `discard_experiment` with candidate_version to discard candidate and leave active untouched.
       - If the user requests to revert or rollback to baseline:
         - Call `rollback_experiment(target_version="v001")`.
       - Never promote automatically without human approval.
  config:
    sandbox:
      enabled: true
      file_downloads: true
    dynamic_sub_agents:
      enabled: true
    ask_user_questions:
      enabled: true
    context_management:
      compaction:
        enabled: true
      large_tool_response:
        enabled: true
  mcp_servers:
    - name: rag-doctor-mcp

subagents:
  - name: diagnose
    model:
      provider: google-gemini
      name: google-gemini/gemini-2-5-flash
    instructions: |
      You are the Diagnose Subagent for RAG Doctor.
      Your mission is to determine the most likely root cause of RAG pipeline degradation from empirical evidence.

      You have read-only access to the RAG Doctor MCP server tools:
      - `inspect_rag_health`: view active vs baseline health and score degradation.
      - `get_pipeline_config`: inspect chunk size, overlap, top_k, and embedding model parameters.
      - `get_failed_queries`: inspect failing questions, ground truth answers, generated answers, and retrieved chunks.
      - `inspect_retrieval`: run ad-hoc retrieval queries against specific index versions.
      - `get_evaluation_results`: retrieve overall faithfulness and answer relevancy metrics.

      Guidelines:
      - Gather evidence from multiple MCP tools before reaching a conclusion.
      - Compare the active degraded configuration with the baseline configuration.
      - Inspect the retrieved chunks of failing queries for truncation, missing context, or low top_k counts.
      - Do not guess or assume any pre-conceived defect; base your diagnosis strictly on observed data.
      - State uncertainty where evidence is partial or ambiguous.
      - You are strictly read-only. Do not attempt to modify files, indexes, or configurations.

      Allowed suspected causes:
      - chunking problem
      - retrieval problem
      - embedding problem
      - indexing problem
      - metadata/context problem
      - generation problem
      - evaluation/data problem
    response_format:
      type: json_schema
      json_schema:
        name: rag_diagnosis
        description: Structured root cause diagnosis for RAG pipeline degradation
        strict: true
        schema:
          type: object
          properties:
            suspected_cause:
              type: string
              enum:
                - chunking problem
                - retrieval problem
                - embedding problem
                - indexing problem
                - metadata/context problem
                - generation problem
                - evaluation/data problem
            evidence:
              type: string
              minLength: 15
              description: Substantiated empirical evidence citing observed chunk sizes, overlap, top_k, query context, or scores
            confidence:
              type: number
              minimum: 0.0
              maximum: 1.0
            hypothesis:
              type: string
            recommended_experiment:
              type: string
          required:
            - suspected_cause
            - evidence
            - confidence
            - hypothesis
            - recommended_experiment
          additionalProperties: false
    config:
      sandbox:
        enabled: false
      dynamic_sub_agents:
        enabled: false
      ask_user_questions:
        enabled: false
      context_management:
        compaction:
          enabled: true
        large_tool_response:
          enabled: true
    mcp_servers:
      - name: rag-doctor-mcp
        enable_tools:
          - inspect_rag_health
          - get_evaluation_results
          - get_failed_queries
          - inspect_retrieval
          - get_pipeline_config

  - name: fix
    model:
      provider: google-gemini
      name: google-gemini/gemini-2-5-flash
    instructions: |
      You are the Fix Subagent for RAG Doctor 🩺.
      Your mission is to turn a root-cause diagnosis of RAG pipeline degradation into a concrete, isolated candidate experiment specification.

      Supported remediation strategies for MVP:
      1. `chunking`:
         - Supported parameter changes: `chunk_size` (int), `overlap` (int)
         - Use when the diagnosis identifies fragmented text, truncated context, or poor semantic boundaries.
      2. `retrieval`:
         - Supported parameter changes: `top_k` (int)
         - Use when the diagnosis identifies insufficient chunk count or rank cutoff causing relevant passages to be missed.

      Rules:
      - Propose, do not execute: You design an experiment specification for isolated sandbox execution.
      - Make the smallest reasonable parameter change to remediate the defect.
      - Do not modify unrelated parameters or active index state.
      - Base parameter adjustments directly on diagnosis evidence and baseline configuration.
      - Strictly output JSON matching the required schema.
    response_format:
      type: json_schema
      json_schema:
        name: rag_fix_experiment
        description: Structured candidate experiment specification to remediate RAG degradation
        strict: true
        schema:
          type: object
          properties:
            hypothesis:
              type: string
            strategy:
              type: string
              enum:
                - chunking
                - retrieval
            changes:
              type: object
              properties:
                chunk_size:
                  type: integer
                  minimum: 50
                  maximum: 4000
                overlap:
                  type: integer
                  minimum: 0
                  maximum: 1000
                top_k:
                  type: integer
                  minimum: 1
                  maximum: 50
              minProperties: 1
              additionalProperties: false
            expected_effect:
              type: string
            reasoning:
              type: string
          required:
            - hypothesis
            - strategy
            - changes
            - expected_effect
            - reasoning
          additionalProperties: false
    config:
      sandbox:
        enabled: false
      dynamic_sub_agents:
        enabled: false
      ask_user_questions:
        enabled: false
      context_management:
        compaction:
          enabled: true
        large_tool_response:
          enabled: true
    mcp_servers:
      - name: rag-doctor-mcp
        enable_tools:
          - get_pipeline_config
          - inspect_retrieval
